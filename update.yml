name: 출국장 혼잡도 갱신

on:
  schedule:
    # 10분마다. GitHub cron은 실제로 몇 분 늦게 도는 일이 흔합니다(정상입니다).
    # 원본 데이터 자체가 10분 단위로 갱신되는 걸로 보여 이 주기면 충분합니다.
    # 하루 약 144회 → 일일 트래픽 한도 1,000건 안에 넉넉히 들어갑니다.
    - cron: "*/10 * * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write           # 결과를 저장소에 커밋해야 하므로 필요

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 데이터 받아오기
        id: fetch
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python3 scripts/fetch.py

      - name: 저장소에 커밋
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신"
            git push
          fi
