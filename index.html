<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101B2E">
<title>인천공항 출국장 지금</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#EFF2F7; --surface:#FFFFFF; --surface-2:#E7ECF3; --panel:#101B2E;
    --ink:#0E1728; --ink-2:#54617A; --ink-3:#8894AB; --line:#D3DBE6;
    --accent:#0B6FB8;
    --ok:#15774A;  --ok-bg:#DEF2E7;
    --mid:#8F6106; --mid-bg:#FAEED4;
    --busy:#B04C0C; --busy-bg:#FBE6D6;
    --jam:#B02929;  --jam-bg:#FADDDD;
    --off:#7A8499;  --off-bg:#E9ECF1;
    --on-panel:#F2F6FC; --on-panel-2:#8FA3C2; --panel-line:#22304A;
    --radius:14px;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"IBM Plex Sans KR","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#070D18; --surface:#111A29; --surface-2:#192335; --panel:#0B1322;
      --ink:#E9EEF6; --ink-2:#94A2BA; --ink-3:#6B7992; --line:#22304A;
      --accent:#57ADEE;
      --ok:#5CD199;  --ok-bg:#0F2A20;
      --mid:#E3B558; --mid-bg:#2C2313;
      --busy:#F29155; --busy-bg:#331C0F;
      --jam:#F27272;  --jam-bg:#331414;
      --off:#7E8CA5;  --off-bg:#1B2434;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:16px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand h1{margin:0;font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
  .brand .sub{font-size:.77rem;color:var(--ink-2);font-family:var(--mono)}
  .live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.73rem;color:var(--ink-2);white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.4s ease-out infinite}
  .dot.bad{background:var(--jam);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;appearance:none;border:0;background:transparent;cursor:pointer;font-family:var(--mono);font-size:.85rem;font-weight:600;color:var(--ink-2);padding:9px 12px;border-radius:8px}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(8,18,35,.12)}
  .seg:has(button:only-child){display:none}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hero{background:var(--panel);color:var(--on-panel);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--panel-line)}
  .hero .lab{font-family:var(--mono);font-size:.69rem;letter-spacing:.14em;text-transform:uppercase;color:var(--on-panel-2)}
  .hero .row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .hero .gate{font-family:var(--mono);font-size:3.2rem;font-weight:700;line-height:.9;letter-spacing:-.04em}
  .hero .gate small{font-size:1rem;font-weight:500;letter-spacing:0;margin-left:5px;color:var(--on-panel-2)}
  .hero .meta{display:flex;flex-direction:column;gap:1px;padding-bottom:5px}
  .hero .meta b{font-family:var(--mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05}
  .hero .meta span{font-size:.75rem;color:var(--on-panel-2)}
  .hero .verdict{font-size:.9rem;border-top:1px solid var(--panel-line);padding-top:12px}
  .hero .verdict em{font-style:normal;color:#7FD3A6;font-weight:600}
  .list{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--st)}
  .card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .no{font-family:var(--mono);font-weight:700;font-size:1.02rem}
  .card .op{font-family:var(--mono);font-size:.67rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .card .tag{font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.05em;padding:3px 7px;border-radius:5px;background:var(--st-bg);color:var(--st);white-space:nowrap}
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .side{background:var(--surface-2);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
  .side .sl{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;color:var(--ink-3)}
  .side .sv{display:flex;align-items:baseline;gap:4px}
  .side .sv b{font-family:var(--mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1;color:var(--sc)}
  .side .sv span{font-size:.72rem;color:var(--ink-2)}
  .side .pp{font-family:var(--mono);font-size:.68rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .bar{height:4px;border-radius:3px;background:var(--bg);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--sc);border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .card.closed{opacity:.72}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:10px}
  .panel h2{margin:0;font-size:.82rem;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .panel h2 em{font-style:normal;font-family:var(--mono);font-size:.67rem;color:var(--ink-3)}
  .spark{width:100%;height:64px;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-family:var(--mono);font-size:.67rem;color:var(--ink-2)}
  .legend i{display:inline-block;width:9px;height:2.5px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .err{background:var(--jam-bg);border:1px solid color-mix(in srgb,var(--jam) 35%,transparent);color:var(--jam);border-radius:var(--radius);padding:14px 16px;font-size:.86rem}
  .err b{display:block;margin-bottom:6px}
  .err code{font-family:var(--mono);font-size:.74rem;display:block;margin-top:8px;word-break:break-all;opacity:.85}
  .note{font-size:.77rem;color:var(--ink-3);line-height:1.65;margin:0}
  .note b{color:var(--ink-2);font-weight:600}
  .warn{border-left:3px solid var(--mid);padding-left:12px}
  .scale{display:flex;gap:5px;flex-wrap:wrap;font-family:var(--mono);font-size:.67rem;color:var(--ink-2)}
  .scale span{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;background:var(--surface-2)}
  .scale i{width:7px;height:7px;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <h1>인천공항 출국장 지금</h1>
      <div class="sub" id="stamp">불러오는 중…</div>
    </div>
    <div class="live"><span class="dot" id="dot"></span><span id="ago">연결 중</span></div>
  </div>

  <div id="errBox"></div>
  <div class="seg" role="group" aria-label="터미널" id="segBox"></div>

  <div class="hero">
    <div class="lab">지금 가장 빠른 곳</div>
    <div class="row">
      <div class="gate" id="bestGate">—</div>
      <div class="meta"><b id="bestWait">—</b><span id="bestSub">—</span></div>
    </div>
    <div class="verdict" id="verdict">—</div>
  </div>

  <div class="list" id="list"></div>

  <div class="panel">
    <h2>대기시간 추이 <em>페이지를 켜둔 동안</em></h2>
    <svg class="spark" id="spark" preserveAspectRatio="none"></svg>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <h2>단계 기준 — 대기시간</h2>
    <div class="scale">
      <span><i style="background:var(--ok)"></i>여유 · ~10분</span>
      <span><i style="background:var(--mid)"></i>보통 · ~20분</span>
      <span><i style="background:var(--busy)"></i>혼잡 · ~30분</span>
      <span><i style="background:var(--jam)"></i>매우혼잡 · 30분+</span>
    </div>
    <p class="note warn">
      <b>운영시간이 빈 값이고 대기인원이 0명인 출국장은 추천에서 제외됩니다.</b>
      대기시간이 제일 짧게 찍히지만 실제로는 닫혀 있을 가능성이 커서, 그대로 안내하면
      사용자를 닫힌 문 앞에 세우게 됩니다.
    </p>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ══════════ 설정 — 여기만 보시면 됩니다 ══════════
   *
   * MODE "direct" : data.go.kr을 브라우저에서 바로 호출합니다.
   *                 설치할 게 없어 제일 빠릅니다. 다만
   *                   · CORS로 막힐 수 있고 (막히면 화면이 알려줍니다)
   *                   · 인증키가 소스에 노출됩니다 → 남에게 공유/배포 금지, 혼자 볼 때만
   *
   * MODE "proxy"  : worker.js를 Cloudflare에 올리고 그 주소를 PROXY_URL에 넣습니다.
   *                 키가 안 보이고 CORS도 해결되며 캐시로 트래픽도 아낍니다. 공개 배포는 이걸로.
   */
  // "auto" : /api/congestion (Vercel 서버 함수) 를 먼저 쓰고, 없으면 data/latest.json 으로 넘어감
  // "proxy": /api/congestion 만 사용   |   "static": data/latest.json 만 사용
  var MODE      = "auto";
  var PROXY_URL = "/api/congestion";
  var DATA_URL  = "./data/latest.json";

  var POLL_MS = 90000;        // 90초. 일일 한도 1000건 때문에 더 짧게 하지 마세요
  var STEPS   = [10, 20, 30]; // 여유 / 보통 / 혼잡 경계 (분)
  /* ═══════════════════════════════════════════════ */

  var TERMINALS = { P01:"제1여객터미널", P02:"탑승동", P03:"제2여객터미널" };
  var SIDE_NAME = { E:"동편", W:"서편" };
  var LEVELS = [
    {k:"여유",     c:"var(--ok)",   b:"var(--ok-bg)"},
    {k:"보통",     c:"var(--mid)",  b:"var(--mid-bg)"},
    {k:"혼잡",     c:"var(--busy)", b:"var(--busy-bg)"},
    {k:"매우혼잡", c:"var(--jam)",  b:"var(--jam-bg)"}
  ];
  var OFF = {k:"운영정보 없음", c:"var(--off)", b:"var(--off-bg)"};
  var LINE_COLORS = ["#0B6FB8","#15774A","#B04C0C","#7B4FCF","#B02929","#0E7C86"];

  var term = null, terms = [], history = {}, lastAt = null, lastStamp = null;

  function $(id){ return document.getElementById(id); }
  function pad(n){ return n<10?"0"+n:""+n; }
  function levelOf(m){ return m<STEPS[0]?0 : m<STEPS[1]?1 : m<STEPS[2]?2 : 3; }
  function parseGate(id){
    var m = /^DG(\d+)_([EW])$/i.exec(String(id||"").trim());
    return m ? { no:+m[1], side:m[2].toUpperCase() } : null;
  }
  function parseTime(s){
    var m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(String(s||"").trim());
    return m ? new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]) : null;
  }

  var useFallback = (MODE === "static");   // auto 모드에서 서버 함수가 실패하면 true로 바뀐다

  function buildUrl(){
    if(useFallback) return DATA_URL + "?v=" + Date.now();
    return PROXY_URL.replace(/\/+$/,"") + "?v=" + Date.now();
  }

  function sourceLabel(){
    return useFallback ? "저장된 파일" : "실시간";
  }

  function load(){
    fetch(buildUrl(), { cache:"no-store" })
      .then(function(r){
        return r.text().then(function(text){ return { status:r.status, text:text }; });
      })
      .then(function(r){
        var json;
        try { json = JSON.parse(r.text); }
        catch(e){
          // 404 HTML 페이지 같은 게 오면 여기로 온다
          return fail("응답이 JSON이 아닙니다.",
            useFallback
              ? "data/latest.json 이 배포에 포함되지 않은 것 같습니다."
              : "/api/congestion 이 배포되지 않았거나 경로가 다릅니다.",
            r.text.slice(0,300));
        }
        if(json.ok === false){
          // 서버 함수가 정상 동작하며 원인을 알려준 경우 → 폴백하지 않고 그대로 보여준다
          return showError("API 오류", (json.message || json.error || "") + (json.hint ? " " + json.hint : ""), json.rawHead);
        }
        var body = json.data ? json.data : json;
        var head = body.response && body.response.header;
        if(head && head.resultCode !== "00"){
          return showError("API 오류", (head.resultMsg||"") + " (코드 " + head.resultCode + ")");
        }
        var items = body.response && body.response.body && body.response.body.items;
        if(!items) return fail("항목을 찾지 못했습니다.", "", r.text.slice(0,300));
        if(!Array.isArray(items)) items = items.item ? (Array.isArray(items.item)?items.item:[items.item]) : [];
        ingest(items);
      })
      .catch(function(e){ fail("연결하지 못했습니다.", "", String(e)); });
  }

  // auto 모드면 서버 함수 실패 시 저장된 파일로 한 번 넘어가 본다
  function fail(title, msg, raw){
    if(MODE === "auto" && !useFallback){
      useFallback = true;
      console.warn("서버 함수 실패 → data/latest.json 으로 전환:", title, raw);
      load();
      return;
    }
    showError(title, msg, raw);
  }

  function ingest(items){
    var byTerm = {};
    items.forEach(function(it){
      var g = parseGate(it.gateId); if(!g) return;
      var t = it.terminalId || "P01";
      var slot = byTerm[t] = byTerm[t] || {};
      var gate = slot[g.no] = slot[g.no] || { no:g.no, op:"", sides:{} };
      var op = String(it.operatingTime||"").trim();
      if(op) gate.op = op;
      gate.sides[g.side] = { wait:parseInt(it.waitTime,10)||0, len:parseInt(it.waitLength,10)||0 };
      if(!lastStamp) lastStamp = parseTime(it.occurtime);
      else { var d = parseTime(it.occurtime); if(d && d > lastStamp) lastStamp = d; }
    });

    var ts = Object.keys(byTerm).sort();
    if(!ts.length){ showError("읽을 수 있는 출국장 데이터가 없습니다."); return; }
    clearError();

    terms = ts;
    if(!term || ts.indexOf(term) < 0) term = ts[0];

    ts.forEach(function(t){
      var arr = Object.keys(byTerm[t]).map(function(k){ return byTerm[t][k]; })
                      .sort(function(a,b){ return a.no-b.no; });
      arr.forEach(function(g){
        var total = ["E","W"].reduce(function(s,k){ return s + (g.sides[k]?g.sides[k].len:0); }, 0);
        g.trusted = !!g.op || total > 0;               // 운영시간 없고 0명이면 열렸다고 믿지 않는다
        g.best = Math.min.apply(null, ["E","W"].filter(function(k){ return g.sides[k]; })
                                               .map(function(k){ return g.sides[k].wait; }));
      });
      history[t] = history[t] || [];
      history[t].push(arr);
      if(history[t].length > 60) history[t].shift();
    });

    lastAt = new Date();
    buildSeg(); render();
  }

  function buildSeg(){
    $("segBox").innerHTML = terms.map(function(t){
      return '<button data-t="'+t+'" aria-pressed="'+(t===term)+'">'+(TERMINALS[t]||t)+'</button>';
    }).join("");
    Array.prototype.forEach.call($("segBox").querySelectorAll("button"), function(b){
      b.addEventListener("click", function(){ term = b.getAttribute("data-t"); buildSeg(); render(); });
    });
  }

  function render(){
    var arr = history[term] && history[term][history[term].length-1];
    if(!arr || !arr.length) return;

    var pool = [];
    arr.forEach(function(g){
      if(!g.trusted) return;
      ["E","W"].forEach(function(s){
        if(g.sides[s]) pool.push({ no:g.no, side:s, wait:g.sides[s].wait, len:g.sides[s].len });
      });
    });

    if(pool.length){
      pool.sort(function(a,b){ return a.wait-b.wait; });
      var best = pool[0], worst = pool[pool.length-1], diff = worst.wait - best.wait;
      $("bestGate").innerHTML = best.no + '<small>번 ' + SIDE_NAME[best.side] + '</small>';
      $("bestWait").textContent = best.wait + "분";
      $("bestSub").textContent = best.len.toLocaleString("ko-KR") + "명 대기";
      $("verdict").innerHTML = diff >= 3
        ? '제일 막히는 ' + worst.no + '번 ' + SIDE_NAME[worst.side] + '(' + worst.wait + '분) 대신 여기로 가면 <em>' + diff + '분</em> 아낍니다.'
        : '지금은 어디로 가도 비슷합니다. <em>가까운 곳</em>으로 가세요.';
    } else {
      $("bestGate").textContent = "—";
      $("bestWait").textContent = "—";
      $("bestSub").textContent = "";
      $("verdict").textContent = "지금 운영 중인 출국장 정보가 없습니다.";
    }

    $("list").innerHTML = arr.map(function(g){
      var L = g.trusted ? LEVELS[levelOf(g.best)] : OFF;
      var sides = ["E","W"].map(function(s){
        var d = g.sides[s]; if(!d) return "";
        var sc = g.trusted ? LEVELS[levelOf(d.wait)].c : "var(--off)";
        var pct = Math.min(100, Math.round(d.wait/40*100));
        return '<div class="side" style="--sc:'+sc+'">'
             +   '<div class="sl">'+SIDE_NAME[s]+'</div>'
             +   '<div class="sv"><b>'+d.wait+'</b><span>분</span></div>'
             +   '<div class="bar"><i style="width:'+pct+'%"></i></div>'
             +   '<div class="pp">'+d.len.toLocaleString("ko-KR")+'명 대기</div>'
             + '</div>';
      }).join("");
      return '<div class="card'+(g.trusted?"":" closed")+'" style="--st:'+L.c+';--st-bg:'+L.b+'">'
           +   '<div class="hd"><span class="no">'+g.no+'번 출국장</span>'
           +   '<span style="display:flex;align-items:center;gap:9px">'
           +     '<span class="op">'+(g.op||"운영시간 정보 없음")+'</span>'
           +     '<span class="tag">'+L.k+'</span></span></div>'
           +   '<div class="sides">'+sides+'</div></div>';
    }).join("");

    drawSpark(); stamp();
  }

  function drawSpark(){
    var hist = history[term] || [], svg = $("spark"), W=600, H=64, P=4;
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    if(hist.length < 2){
      svg.innerHTML = '<text x="'+(W/2)+'" y="'+(H/2+4)+'" text-anchor="middle" style="font-family:var(--mono);font-size:11px;fill:var(--ink-3)">데이터를 모으는 중… (90초마다 갱신)</text>';
      $("legend").innerHTML = ""; return;
    }
    var maxV = 5;
    hist.forEach(function(a){ a.forEach(function(g){ if(g.best>maxV) maxV=g.best; }); });
    maxV *= 1.15;
    var nos = hist[hist.length-1].map(function(g){ return g.no; });
    var grid = [0.25,0.5,0.75].map(function(f){
      var y=(P+(H-P*2)*f).toFixed(1);
      return '<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    }).join("");
    var lines = nos.map(function(no, gi){
      var pts = hist.map(function(a, si){
        var g = a.filter(function(x){ return x.no===no; })[0];
        var x = P+(W-P*2)*(si/(hist.length-1));
        var y = H-P-(H-P*2)*((g?g.best:0)/maxV);
        return x.toFixed(1)+","+y.toFixed(1);
      }).join(" ");
      return '<polyline points="'+pts+'" fill="none" stroke="'+LINE_COLORS[gi%LINE_COLORS.length]+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>';
    }).join("");
    svg.innerHTML = grid + lines;
    $("legend").innerHTML = nos.map(function(no,gi){
      return '<span><i style="background:'+LINE_COLORS[gi%LINE_COLORS.length]+'"></i>'+no+'번</span>';
    }).join("");
  }

  function stamp(){
    var d = lastStamp || lastAt; if(!d) return;
    $("stamp").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+" 기준 · "
      + (TERMINALS[term]||term) + " · " + sourceLabel();
  }
  function tickAgo(){
    if(!lastAt) return;
    var s = Math.round((Date.now()-lastAt.getTime())/1000);
    $("ago").textContent = s<10 ? "방금 갱신" : (s<60 ? s+"초 전" : Math.floor(s/60)+"분 전");
  }
  function showError(title, msg, raw){
    $("dot").className = "dot bad";
    $("errBox").innerHTML = '<div class="err"><b>'+title+'</b>'+(msg||"")
      + (raw ? '<code>'+String(raw).replace(/</g,"&lt;").slice(0,400)+'</code>' : '')+'</div>';
  }
  function clearError(){ $("dot").className = "dot"; $("errBox").innerHTML = ""; }

  load();
  setInterval(load, POLL_MS);
  setInterval(tickAgo, 1000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); });
})();
</script>
</body>
</html>
